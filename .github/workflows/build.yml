name: build

# Proves the firmware compiles on every push to main and every PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Build firmware (node1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO + pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # node1..node6 differ only by -DNODE_ID, so building node1 proves them all.
      - name: Build node1
        run: pio run -e node1
