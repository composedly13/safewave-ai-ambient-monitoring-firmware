; SafeWave-AI CSI sensor node — PlatformIO project
; Target : ESP32-S3 N16R8 (16 MB flash, 8 MB Octal PSRAM)
; Framework: ESP-IDF v5.x
;
; First-time setup:
;   pip install scipy numpy
;   python tools/gen_sos.py > src/biquad_coeffs.h
;   pio run -t upload

; ── Common base — inherited by every [env:nodeN] below ───────────────────────
[env]
platform        = espressif32
; Generic ESP32-S3-N16R8 module. PlatformIO has no dedicated N16R8 board id,
; so use the generic DevKitC-1 and override for 16 MB flash + 8 MB octal PSRAM:
;   flash size   → board_upload.flash_size + CONFIG_ESPTOOLPY_FLASHSIZE_16MB
;   octal PSRAM  → CONFIG_SPIRAM_MODE_OCT (sdkconfig.defaults)
board           = esp32-s3-devkitc-1
framework       = espidf

; N16R8 flash = 16 MB
board_upload.flash_size = 16MB

; Single-app partition with headroom (factory = 1.5 MB; app is ~0.78 MB).
; Set here (PlatformIO-native) so the table is deterministic and the size
; check reflects the real partition, not the board's 1 MB default.
board_build.partitions = partitions_singleapp_large.csv

; Serial
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, colorize

; Add src/ to include path so headers find each other
build_flags     =
    -I ${PROJECT_DIR}/src
    -DBOARD_HAS_PSRAM

; PSRAM + WiFi CSI configured in sdkconfig.defaults (auto-picked by ESP-IDF build)

; ── One environment per sensor node ──────────────────────────────────────────
; NODE_ID is injected at build time so src/config.h is never hand-edited.
; COM port is unrelated to NODE_ID — pick the env, then point --upload-port at
; whatever port that physical board enumerated as:
;   pio device list                              # find the COM
;   pio run -e node3 -t upload --upload-port COM7 # flash board labelled "3"
; `pio run` with no -e builds all five.
[env:node1]
build_flags = ${env.build_flags} -DNODE_ID=1
[env:node2]
build_flags = ${env.build_flags} -DNODE_ID=2
[env:node3]
build_flags = ${env.build_flags} -DNODE_ID=3
[env:node4]
build_flags = ${env.build_flags} -DNODE_ID=4
[env:node5]
build_flags = ${env.build_flags} -DNODE_ID=5
